<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520">
  <defs>
    <!-- Cyan Crystal Gradient for Star and FinDer -->
    <linearGradient id="cyanJelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0fcff" />
      <stop offset="25%" stop-color="#67e8f9" />
      <stop offset="65%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Orange Gradient for Headers and Subtitle -->
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Star Mascot Plushie Body Gradient -->
    <radialGradient id="mascotBody" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="85%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>

    <!-- Big Blue Eyes -->
    <radialGradient id="mascotEye" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </radialGradient>

    <!-- Cheek Blush -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f87171" stop-opacity="0" />
    </radialGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Top Banner: CHƯƠNG TRÌNH CHÀO! SINH VIÊN 2026 -->
  <text x="470" y="60" text-anchor="middle" fill="url(#orangeGrad)" font-family="Liberation Sans, sans-serif" font-weight="900" font-size="28" letter-spacing="4">
    CHƯƠNG TRÌNH CHÀO! SINH VIÊN 2026
  </text>

  <!-- Center Text "Star" -->
  <g filter="url(#shadowFilter)">
    <text x="400" y="215" text-anchor="middle" fill="url(#cyanJelly)" stroke="#d5fbff" stroke-width="8" stroke-linejoin="round" font-family="Liberation Sans, sans-serif" font-weight="900" font-size="168" letter-spacing="4">
      Star
    </text>
  </g>

  <!-- Center Text "FinDer" -->
  <g filter="url(#shadowFilter)">
    <text x="450" y="375" text-anchor="middle" fill="url(#cyanJelly)" stroke="#d5fbff" stroke-width="8" stroke-linejoin="round" font-family="Liberation Sans, sans-serif" font-weight="900" font-size="152" letter-spacing="8">
      FinDer
    </text>
  </g>

  <!-- Cute Star Mascot sitting on the right of title -->
  <g transform="translate(800, 240)">
    <!-- Legs -->
    <path d="M -16,65 C -20,85 -30,95 -12,98 C -2,100 -2,85 -6,65 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 16,65 C 12,85 2,95 20,98 C 30,100 28,85 24,65 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>

    <!-- Left hand waving down -->
    <path d="M -60,0 C -85,15 -75,35 -60,25 C -50,18 -52,5 -60,0 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>

    <!-- Right hand cheering up -->
    <path d="M 60,-5 C 85,-25 95,-10 80,5 C 70,12 60,8 60,-5 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>

    <!-- Plushie Star Body -->
    <path d="M 0,-85
             C 12,-55 24,-25 55,-20
             C 85,-15 105,0 95,25
             C 85,50 60,65 55,85
             C 50,100 20,90 0,90
             C -20,90 -50,100 -55,85
             C -60,65 -85,50 -95,25
             C -105,0 -85,-15 -55,-20
             C -24,-25 -12,-55 0,-85 Z"
          fill="url(#mascotBody)"
          stroke="#ca8a04"
          stroke-width="3"
    />

    <!-- Blush cheeks -->
    <ellipse cx="-40" cy="20" rx="15" ry="9" fill="url(#blushGrad)" />
    <ellipse cx="40" cy="20" rx="15" ry="9" fill="url(#blushGrad)" />

    <!-- Big Sapphire Eyes -->
    <ellipse cx="-24" cy="-2" rx="12" ry="18" fill="url(#mascotEye)" />
    <ellipse cx="24" cy="-2" rx="12" ry="18" fill="url(#mascotEye)" />

    <!-- Eye sparkles -->
    <circle cx="-28" cy="-8" r="4.5" fill="#ffffff" />
    <circle cx="20" cy="-8" r="4.5" fill="#ffffff" />
    <circle cx="-20" cy="4" r="2.5" fill="#fde047" />
    <circle cx="28" cy="4" r="2.5" fill="#fde047" />

    <!-- Nose -->
    <ellipse cx="0" cy="12" rx="4" ry="3" fill="#f97316" />

    <!-- Smile -->
    <path d="M -8,22 Q 0,30 8,22" stroke="#854d0e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sparkles around title -->
  <polygon points="120,120 123,128 132,130 123,132 120,140 117,132 108,130 117,128" fill="#ffd84d" />
  <polygon points="680,310 682,316 688,318 682,320 680,326 678,320 672,318 678,316" fill="#ffffff" />
  <polygon points="260,250 262,256 268,258 262,260 260,266 258,260 252,258 258,256" fill="#67e8f9" />

  <!-- Subtitle: THEO ÁNH SAO – CHẠM KHÁT KHAO -->
  <text x="470" y="468" text-anchor="middle" fill="url(#orangeGrad)" font-family="Liberation Sans, sans-serif" font-weight="900" font-size="26" letter-spacing="8">
    THEO ÁNH SAO – CHẠM KHÁT KHAO
  </text>
</svg>
